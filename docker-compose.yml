# HeyJoe Screenshot Studio — self-hosted on Hostinger VPS
# Port 3002 (3000=TREK, 3001 reserved). Editor is 100% client-side; DB optional (URL-screenshot cache only).
services:
  screenshot-studio:
    build:
      context: .
    container_name: heyjoe-screenshot-studio
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=production
      # Optional — enables URL-to-screenshot caching; leave unset for plain editor
      # - DATABASE_URL=
      # - R2_ACCOUNT_ID=
      # - R2_ACCESS_KEY_ID=
      # - R2_SECRET_ACCESS_KEY=
      # - R2_BUCKET_NAME=
      # - NEXT_PUBLIC_R2_PUBLIC_URL=
